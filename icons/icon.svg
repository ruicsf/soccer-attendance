<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="62%" r="70%">
      <stop offset="0" stop-color="#4a1405"/>
      <stop offset="0.55" stop-color="#1a0a06"/>
      <stop offset="1" stop-color="#0c0b0d"/>
    </radialGradient>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d1f"/>
      <stop offset="1" stop-color="#b3120a"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <radialGradient id="ball" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e9e6e2"/>
      <stop offset="1" stop-color="#b9b2ab"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="ballClip"><circle cx="50" cy="64" r="19"/></clipPath>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>

  <!-- glow -->
  <circle cx="50" cy="58" r="26" fill="#ff5a14" opacity="0.55" filter="url(#glow)"/>

  <!-- flames -->
  <path fill="url(#outer)" d="M36 76 C18 58 25 41 32 30 C33 38 37 42 41 40 C39 30 44 20 53 11 C53 21 59 26 61 34 C64 30 65 25 64 20 C75 30 83 52 64 76 Z"/>
  <path fill="url(#mid)" d="M33 66 C27 55 31 46 36 39 C37 45 40 48 44 47 C43 38 47 30 53 23 C54 31 58 35 59 42 C62 39 63 36 63 32 C70 41 72 54 67 66 Z"/>
  <path fill="url(#inner)" d="M38 66 C35 58 38 52 42 48 C43 52 45 54 48 53 C48 47 50 41 54 36 C55 42 58 46 58 51 C60 49 61 47 61 45 C65 52 65 60 62 66 Z"/>

  <!-- sparks -->
  <circle cx="24" cy="30" r="1.3" fill="#ffb000"/>
  <circle cx="75" cy="22" r="1.1" fill="#ffd23f"/>
  <circle cx="70" cy="12" r="0.9" fill="#ff5a14"/>
  <circle cx="33" cy="18" r="0.9" fill="#ffd23f"/>

  <!-- ball -->
  <circle cx="50" cy="64" r="19" fill="url(#ball)"/>
  <g clip-path="url(#ballClip)" fill="#17151a">
    <polygon points="50,57 56.66,61.84 54.11,69.66 45.89,69.66 43.34,61.84"/>
    <circle cx="50" cy="42.5" r="5.5"/>
    <circle cx="70.4" cy="57.4" r="5.5"/>
    <circle cx="62.6" cy="81.4" r="5.5"/>
    <circle cx="37.4" cy="81.4" r="5.5"/>
    <circle cx="29.6" cy="57.4" r="5.5"/>
    <g stroke="#17151a" stroke-width="1.8" stroke-linecap="round">
      <line x1="50" y1="57" x2="50" y2="46"/>
      <line x1="56.66" y1="61.84" x2="67" y2="58.5"/>
      <line x1="54.11" y1="69.66" x2="60.5" y2="78.5"/>
      <line x1="45.89" y1="69.66" x2="39.5" y2="78.5"/>
      <line x1="43.34" y1="61.84" x2="33" y2="58.5"/>
    </g>
  </g>
  <!-- warm rim light from the fire -->
  <path d="M33.5 56 A19 19 0 0 1 66.5 56" fill="none" stroke="#ffb000" stroke-width="1" opacity="0.45"/>
</svg>
