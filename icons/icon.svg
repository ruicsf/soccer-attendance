<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="60%" cy="58%" r="75%">
      <stop offset="0" stop-color="#3a1206"/>
      <stop offset="0.5" stop-color="#170a07"/>
      <stop offset="1" stop-color="#0c0b0d"/>
    </radialGradient>
    <!-- trail colors run from the tail (x=-60) to the ball (x=0) -->
    <linearGradient id="outer" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#b3120a" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e3261b"/>
      <stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="-48" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="-34" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6c2"/>
    </linearGradient>
    <radialGradient id="ball" cx="62%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#ece9e5"/>
      <stop offset="1" stop-color="#b3aca5"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="ballClip"><circle r="17"/></clipPath>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>

  <!-- fire trail, pointing up-left from the ball -->
  <g transform="translate(64 60) rotate(35)">
    <ellipse cx="-22" cy="0" rx="34" ry="15" fill="#ff5a14" opacity="0.45" filter="url(#blur)"/>
    <path fill="url(#outer)" d="M0 -18 C-14 -20 -26 -17 -38 -12 C-34 -9 -36 -7 -46 -6 C-38 -3 -38 0 -60 1 C-42 4 -40 7 -48 10 C-36 11 -30 13 -36 16 C-22 17 -12 19 0 18 Z"/>
    <path fill="url(#mid)" d="M0 -14 C-10 -15 -20 -13 -28 -9 C-25 -7 -27 -5 -34 -4 C-28 -1 -30 1 -48 2 C-32 5 -30 7 -34 10 C-22 11 -12 15 0 14 Z"/>
    <path fill="url(#inner)" d="M0 -10 C-8 -10 -14 -8 -20 -5 C-17 -3 -18 -1 -34 0 C-20 2 -19 4 -22 6 C-14 8 -8 10 0 10 Z"/>
    <g stroke="#ffd23f" stroke-linecap="round" opacity="0.7">
      <line x1="-26" y1="-24" x2="-44" y2="-24" stroke-width="1.2"/>
      <line x1="-30" y1="23" x2="-42" y2="23" stroke-width="1"/>
    </g>
  </g>

  <!-- ball -->
  <g transform="translate(64 60) rotate(12)">
    <circle r="17" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)" fill="#17151a">
      <polygon points="0,-6 5.71,-1.85 3.53,4.85 -3.53,4.85 -5.71,-1.85"/>
      <circle cx="0" cy="-18.5" r="5"/>
      <circle cx="17.59" cy="-5.72" r="5"/>
      <circle cx="10.87" cy="14.97" r="5"/>
      <circle cx="-10.87" cy="14.97" r="5"/>
      <circle cx="-17.59" cy="-5.72" r="5"/>
      <g stroke="#17151a" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-6" x2="0" y2="-14"/>
        <line x1="5.71" y1="-1.85" x2="13.31" y2="-4.33"/>
        <line x1="3.53" y1="4.85" x2="8.23" y2="11.33"/>
        <line x1="-3.53" y1="4.85" x2="-8.23" y2="11.33"/>
        <line x1="-5.71" y1="-1.85" x2="-13.31" y2="-4.33"/>
      </g>
    </g>
  </g>
</svg>
