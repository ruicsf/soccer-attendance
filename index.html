<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Attendance</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="Attendance">
  <meta name="theme-color" content="#f5f7f5">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header>
    <div class="title-row">
      <h1><span class="ball">⚽</span> Team Attendance</h1>
      <button id="install" class="btn primary small" hidden>Install app</button>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="games">Games</button>
      <button class="tab" data-view="players">Players</button>
    </nav>
  </header>
  <main id="app"><p class="muted loading">Loading…</p></main>
  <script>
    // If the app fails to start, say so instead of showing "Loading…" forever
    window.addEventListener("error", (e) => {
      document.getElementById("app").innerHTML = '<div class="card"><h2>Something went wrong</h2><p>' +
        String(e.message).replace(/</g, "&lt;") + '</p><p>Try refreshing the page.</p></div>';
    });
    setTimeout(() => {
      const loading = document.querySelector("#app .loading");
      if (loading) loading.textContent = "Still loading… Try refreshing. If you use a content blocker or private browsing, turn it off for this site.";
    }, 10000);
  </script>
  <script type="module" src="app.js?v=6"></script>
</body>
</html>
